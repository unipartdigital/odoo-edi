name: odoo-edi

on:
  pull_request:
  push:
    branches:
      - "master"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t odoo-edi-tester .
      - name: Run Tests in Docker
        run: docker run --rm odoo-edi-tester
